# 上传大小限制（FileUploadConfiguration 里读取，默认 100MB/120MB）
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=120MB

# zip 解压默认目标目录，接口可用 targetDir 参数覆盖
file.upload.zip-target-dir=/tmp

# zip 解压实现：commons-compress（默认，Zip64/更多压缩方法）| jdk（零依赖）
file.upload.zip-extractor=commons-compress
