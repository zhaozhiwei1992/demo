spring:
#  http:
#    multipart:
#      max-file-size: 200Mb # 最大上传文件, 默认1M
#      max-request-size: 220Mb
  # 上传大小限制（FileUploadConfiguration 里读取，默认 100MB/120MB）
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 120MB


file:
  upload:
    # zip 解压实现：commons-compress（默认，Zip64/更多压缩方法）| jdk（零依赖）
    zip-extractor: commons-compress
    # zip 解压默认目标目录，接口可用 targetDir 参数覆盖
    zip-target-dir: /tmp

