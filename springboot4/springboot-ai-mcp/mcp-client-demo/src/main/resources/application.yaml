server:
  port: 8080

spring:
  ai:
    openai:
      base-url: https://19921514.xyz/new-api/v1   # 或你的兼容网关
      api-key: ${NEW_API_KEY}
      chat:
        options:
          model: deepseek-v4.1-flash
          temperature: 0.7
    mcp:
      client:
        request-timeout: 30s
        sse:
          connections:
            weather-server:
              url: http://localhost:8088   # 你之前起的 MCP Server
              sse-endpoint: /sse